name: Build bootable ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install OS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib grub-pc-bin xorriso mtools make

      - name: Build ISO
        run: make TARGET=host CC=gcc AS=as LD=ld

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: sooome-cooooool-os
          path: build/sooome-cooooool-os.iso
          if-no-files-found: error
